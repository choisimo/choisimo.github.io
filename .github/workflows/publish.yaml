name: Build and Deploy SPA Blog to GitHub Pages

on:
  # Trigger the workflow on push to main branch
  push:
    branches: ["main"]
  # Allow manual triggers
  workflow_dispatch:
  # Also trigger when content is updated through the CMS
  repository_dispatch:
    types: [cms_update]

# Set permissions for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment is allowed
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Build static post data
        run: |
          echo "Building static JSON data from markdown posts..."
          python build.py
          echo "Build completed successfully"

      - name: List generated files
        run: |
          echo "Generated data files:"
          ls -la data/
          echo "Posts data preview:"
          head -20 data/posts.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
