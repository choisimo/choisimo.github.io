name: Deploy website to GitHub Pages

env:
  HUGO_VERSION: '0.124.1'

on:
  # Trigger the workflow on push to main branch
  push:
    branches: ["main"]
  # Allow manual triggers
  workflow_dispatch:
  # Also trigger when content is updated through the CMS
  repository_dispatch:
    types: [cms_update]

# Set permissions for GitHub Pages
permissions:
  contents: write  # For pushing to the repository
  pages: write     # For deploying to GitHub Pages
  id-token: write  # For GitHub OIDC

# Only one concurrent deployment is allowed
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for .GitInfo and .Lastmod
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Cache Hugo modules
        uses: actions/cache@v4
        with:
          path: ~/.cache/hugo_modules/
          key: ${{ runner.os }}-hugo-modules-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-hugo-modules-

      - name: Build
        run: hugo --minify --gc
        env:
          HUGO_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy-pages:
    if: github.repository_owner != 'HugoBlox'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: |
          echo "Hugo Cache Dir: $(hugo config | grep cachedir)"
          hugo --minify --baseURL "${{ steps.deployment.outputs.page_url }}/"
      - name: Generate Pagefind search index
        run: npx pagefind --source "public"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
