# Unified Dark Mode Theme Configuration
name = "Unified Blog Theme"

[light]
  # Primary colors
  primary = "#667eea"
  primary_hover = "#5a67d8"
  
  # Text colors  
  text_color = "#2d3748"
  text_color_secondary = "#4a5568"
  text_muted = "#718096"
  heading_color = "#1a202c"
  
  # Background colors
  bg_body = "#f7fafc"
  bg_color = "#ffffff"
  bg_color_secondary = "#edf2f7"
  card_bg = "#ffffff"
  
  # Menu colors
  menu_primary = "#ffffff"
  menu_text = "#2d3748"
  menu_text_active = "#667eea"
  menu_title = "#1a202c"
  
  # Section colors
  home_section_odd = "#f7fafc"
  home_section_even = "#edf2f7"

[dark]
  # Primary colors
  primary = "#7f9cf5"
  primary_hover = "#93c5fd"
  
  # Text colors
  text_color = "#e2e8f0"
  text_color_secondary = "#cbd5e0"
  text_muted = "#a0aec0"
  heading_color = "#f7fafc"
  
  # Background colors
  bg_body = "#1a202c"
  bg_color = "#1a202c"
  bg_color_secondary = "#2d3748"
  card_bg = "#2d3748"
  
  # Menu colors
  menu_primary = "#2d3748"
  menu_text = "#e2e8f0"
  menu_text_active = "#7f9cf5"
  menu_title = "#f7fafc"
  
  # Section colors
  home_section_odd = "#1a202c"
  home_section_even = "#2d3748" 
