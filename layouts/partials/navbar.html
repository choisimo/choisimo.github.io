<!-- Navigation Bar -->
<header class="navbar">
  <div class="navbar-brand">
    <a href="{{ "/" | relLangURL }}" class="brand-link">
      <img src="/media/logo.png"  class="logo" width="40" height="40">
      <div class="brand-text">
        <span class="brand-name">nodove</span>
        <span class="brand-suffix">블로그</span>
      </div>
    </a>
  </div>
  
  <button class="mobile-nav-toggle" aria-label="Toggle navigation">
    <span class="toggle-icon"></span>
  </button>

  <nav class="navbar-nav">
    <!-- Main Menu Items -->
    <div class="nav-item">
      <a class="nav-link" href="{{ "/" | relLangURL }}">
        홈
      </a>
    </div>
    <div class="nav-item">
      <a class="nav-link" href="{{ "/post/" | relLangURL }}">
        게시글
      </a>
    </div>
    <div class="nav-item dropdown">
      <a href="#" class="nav-link dropdown-toggle" data-toggle="dropdown" role="button" aria-expanded="false">
        카테고리
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </a>
      <div class="dropdown-menu">
        <a class="dropdown-item" href="{{ "/categories/" | relLangURL }}">모든 카테고리</a>
        <a class="dropdown-item" href="{{ "/tags/" | relLangURL }}">태그</a>
      </div>
    </div>
    <div class="nav-item">
      <a class="nav-link" href="{{ "/about/" | relLangURL }}">
        정보
      </a>
    </div>
  </nav>

  <div class="navbar-actions">
    <!-- Search -->
    <div class="search-container">
      <button class="search-toggle" aria-label="Toggle search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
      </button>
      <div class="search-box" id="search-box">
        <input type="text" id="search-input" placeholder="검색..." autocomplete="off" />
        <div id="search-results" class="search-results"></div>
      </div>
    </div>
    
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
      <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
    
    <!-- Simple language selector with hardcoded links -->
    <div class="lang-selector">
      <a href="/ko/" hreflang="ko" class="lang-link">한국어</a>
      <a href="/en/" hreflang="en" class="lang-link">English</a>
    </div>
  </div>
</header>

<script>
  // Search functionality
  const searchToggle = document.querySelector('.search-toggle');
  const searchBox = document.querySelector('.search-box');
  const searchInput = document.querySelector('#search-input');
  const searchResults = document.querySelector('#search-results');
  
  if (searchToggle && searchBox) {
    searchToggle.addEventListener('click', function() {
      searchBox.classList.toggle('active');
      if (searchBox.classList.contains('active')) {
        searchInput.focus();
      }
    });
    
    // Simple search implementation
    searchInput.addEventListener('input', function() {
      const query = this.value.toLowerCase().trim();
      if (query.length < 2) {
        searchResults.innerHTML = '';
        return;
      }
      
      // You would implement your search logic here
      // For now, we'll show a simple message
      searchResults.innerHTML = `<div class="search-result">검색 기능을 구현 중입니다: "${query}"</div>`;
    });
    
    // Close search when clicking outside
    document.addEventListener('click', function(e) {
      if (!searchBox.contains(e.target) && !searchToggle.contains(e.target)) {
        searchBox.classList.remove('active');
      }
    });
  }
  
  // Toggle dropdown menus
  document.querySelectorAll('.dropdown-toggle').forEach(dropdownToggle => {
    dropdownToggle.addEventListener('click', function(e) {
      e.preventDefault();
      const dropdown = this.nextElementSibling;
      dropdown.classList.toggle('show');
    });
  });
  
  // Close dropdowns when clicking outside
  document.addEventListener('click', function(e) {
    if (!e.target.matches('.dropdown-toggle')) {
      document.querySelectorAll('.dropdown-menu.show').forEach(dropdown => {
        dropdown.classList.remove('show');
      });
    }
  });
  
  // Dark mode toggle
  const themeToggle = document.querySelector('.theme-toggle');
  themeToggle.addEventListener('click', function() {
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
  });
  
  // Apply saved theme
  if (localStorage.getItem('theme') === 'dark' || 
      (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  }
</script>
