<!-- Enhanced Navigation Bar - PRD Aligned -->
<header class="navbar">
  <div class="container">
    <div class="navbar-brand">
      <a href="{{ "/" | relLangURL }}" class="brand-link">
        <img src="/media/logo.png" class="logo" width="40" height="40" alt="nodove 로고">
        <div class="brand-text">
          <span class="brand-name">nodove</span>
          <span class="brand-suffix">블로그</span>
        </div>
      </a>
    </div>
    
    <button class="mobile-nav-toggle" aria-label="메뉴 토글" aria-expanded="false">
      <span class="toggle-icon"></span>
    </button>

    <nav class="navbar-nav">
      <!-- Main Menu Items -->
      <div class="nav-item">
        <a class="nav-link" href="{{ "/" | relLangURL }}">홈</a>
      </div>
      <div class="nav-item">
        <a class="nav-link" href="{{ "/post/" | relLangURL }}">게시글</a>
      </div>
      <div class="nav-item dropdown">
        <a href="#" class="nav-link dropdown-toggle" data-toggle="dropdown" role="button" aria-expanded="false">
          카테고리
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </a>
        <div class="dropdown-menu">
          <a class="dropdown-item" href="{{ "/categories/" | relLangURL }}">모든 카테고리</a>
          <a class="dropdown-item" href="{{ "/tags/" | relLangURL }}">태그</a>
        </div>
      </div>
      <div class="nav-item">
        <a class="nav-link" href="{{ "/about/" | relLangURL }}">정보</a>
      </div>
      
      <!-- PRD: Mobile-only items -->
      <div class="nav-item mobile-only">
        <a class="nav-link" href="#" onclick="document.querySelector('.search-toggle').click()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          검색
        </a>
      </div>
      <div class="nav-item mobile-only">
        <a class="nav-link" href="/ko/" hreflang="ko">한국어</a>
      </div>
      <div class="nav-item mobile-only">
        <a class="nav-link" href="/en/" hreflang="en">English</a>
      </div>
    </nav>

    <div class="navbar-actions">
      <!-- Search -->
      <div class="search-container">
        <button class="search-toggle" aria-label="검색 토글">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </button>
        <div class="search-box" id="search-box">
          <input type="text" id="search-input" placeholder="검색어를 입력하세요..." autocomplete="off" />
          <div id="search-results" class="search-results"></div>
        </div>
      </div>
      
      <button class="theme-toggle" id="theme-toggle" aria-label="다크 모드 토글">
        <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
      
      <!-- Language selector (desktop only) -->
      <div class="lang-selector">
        <a href="/ko/" hreflang="ko" class="lang-link">한국어</a>
        <a href="/en/" hreflang="en" class="lang-link">English</a>
      </div>
    </div>
  </div>
</header>
