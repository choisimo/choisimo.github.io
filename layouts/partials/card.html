<div class="card">
  <a href="{{ .Permalink }}" style="text-decoration:none; color:inherit;">
    <div class="card-image">
      <img src="{{ with .Params.featured_image }}{{ . }}{{ else }}default-image.jpg{{ end }}" alt="{{ .Title }}" loading="lazy">
    </div>
    <div class="card-content">
      <h3>{{ .Title }}</h3>
      <p>{{ .Summary }}</p>
      <p><small>{{ .Date.Format "January 2, 2006" }}</small></p>
      <span class="btn">자세히 보기</span>
    </div>
  </a>
</div>
