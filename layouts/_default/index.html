<div style="max-width: 1200px; margin: 0 auto; padding: 2rem;">
  <div class="cards-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem;">
    {{ range .Paginator.Pages }}
      {{ partial "card.html" . }}
    {{ end }}
  </div>
  
  <!-- Pagination -->
  {{ if gt .Paginator.TotalPages 1 }}
    <nav class="pagination" style="margin-top: 3rem; text-align: center;">
      {{ if .Paginator.HasPrev }}
        <a href="{{ .Paginator.Prev.URL }}" class="btn btn-secondary" style="margin-right: 1rem;">이전</a>
      {{ end }}
      
      <span style="margin: 0 1rem;">
        {{ .Paginator.PageNumber }} / {{ .Paginator.TotalPages }}
      </span>
      
      {{ if .Paginator.HasNext }}
        <a href="{{ .Paginator.Next.URL }}" class="btn btn-secondary" style="margin-left: 1rem;">다음</a>
      {{ end }}
    </nav>
  {{ end }}
</div>
